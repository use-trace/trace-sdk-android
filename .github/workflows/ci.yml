name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # House rules shared by every Trace repository (docs/plans/REPO_AUTOMATION.md in use-trace/trace).
  house:
    name: house
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No em dashes or en dashes
        run: |
          # Byte patterns, so the check reads the same whatever the runner's locale. -I skips binary files.
          if git grep -nIF -e $'\xe2\x80\x93' -e $'\xe2\x80\x94' -- .; then
            echo "Found an em dash or en dash. Use commas, colons or full stops." >&2
            exit 1
          fi
          echo "Clean."
      - name: Runners are pinned
        run: |
          # A moving label such as ubuntu-latest changes the machine under every job on GitHub's schedule, not ours.
          if grep -nE '^[[:space:]]*runs-on:.*-latest' .github/workflows/*.yml; then
            echo "Pin the runner (ubuntu-24.04 or macos-15)." >&2
            exit 1
          fi
          echo "Pinned."

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the library
        run: ./gradlew :trace:assembleRelease --no-daemon

  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Each Robolectric test runs at minSdk 21 and at compileSdk 35 (robolectric.properties), so this is both levels.
      - name: Run the unit tests
        run: ./gradlew :trace:testDebugUnitTest --no-daemon
      - name: Keep the reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: trace/build/reports/tests/

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint on the release variant
        run: ./gradlew :trace:lintRelease --no-daemon
      - name: Keep the report when lint fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: trace/build/reports/lint-results-release.html

  # The privacy rules in CLAUDE.md and the README, checked in code: no advertising or device identifier, no
  # identify, logging only through TraceLog, no permissions, and nothing on the classpath but the referrer client.
  privacy:
    name: privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/check-privacy.sh

  # The public API compared with trace/api/trace.api (Kotlin's binary compatibility validator), so any change to it
  # shows in the diff and a breaking one is seen before it needs a major version.
  api:
    name: api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare the public API with trace/api/trace.api
        run: ./gradlew :trace:apiCheck --no-daemon
      - name: Write the API as it now is, for a change that was meant
        if: failure()
        run: ./gradlew :trace:apiDump --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-dump
          path: trace/api/
