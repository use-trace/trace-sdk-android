name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  copy-rules:
    name: copy rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes or en dashes
        run: |
          # A house rule across every Trace repository. Checked from the first commit, because retrofitting it
          # across a grown codebase is the expensive way to find out it was never enforced.
          if grep -rInP '[\x{2014}\x{2013}]' --exclude-dir=.git . ; then
            echo "Found an em dash or en dash. Use commas, colons or full stops."
            exit 1
          fi
          echo "Clean."

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the library
        run: ./gradlew :trace:assembleRelease --no-daemon

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the unit tests
        run: ./gradlew :trace:testDebugUnitTest --no-daemon
      - name: Keep the reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: trace/build/reports/tests/
