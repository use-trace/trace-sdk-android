name: release

# Publishing (CLAUDE.md, Releasing). On a push to main, when the version in trace/build.gradle.kts has no GitHub
# release yet and the merged pull request carries release-approved: tag v<version>, sign and upload the release AAR
# with its sources and javadoc jars to Maven Central through the Central Portal, create the GitHub release with the
# AAR and the pull request's notes, then build a throwaway app against the version from Central, retrying while
# Central syncs. Missing secrets or a missing licence stop it red before anything is tagged or uploaded.
#
# On a pull request, or started by hand, it is a dry run of the same build: signed with a throwaway key made in the
# job, published to Maven Local, every signature verified, and resolved from there. Nothing leaves the runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What to release
        id: plan
        run: |
          version=$(scripts/version.sh)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run of $version: built, signed with a throwaway key, published to Maven Local and resolved from there." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2> "$RUNNER_TEMP/err"; then
            echo "$version is released already. Nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
            cat "$RUNNER_TEMP/err" >&2
            echo "::error::Could not tell whether $tag is released. Nothing was published."
            exit 1
          fi

          tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag is tagged at $tagged but has no GitHub release, so publishing it did not finish. Re-run the release run for $tagged. Newer code is never published as $version."
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0]' > "$RUNNER_TEMP/pr.json"
          number=$(jq -r '.number // empty' "$RUNNER_TEMP/pr.json")
          if [ -z "$number" ]; then
            echo "::error::$version is not released, and no merged pull request was found for $GITHUB_SHA, so there is no release-approved to read. Nothing was published."
            exit 1
          fi
          if ! jq -e '[.labels[].name] | index("release-approved")' "$RUNNER_TEMP/pr.json" > /dev/null; then
            echo "::warning::$version is not released, and #$number did not carry release-approved, so nothing was published. To release $version, merge a pull request that carries release-approved, or add the label to #$number and re-run this run." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r --arg v "$version" '"\(.title)\n\n\(.body // "")\n\nFrom #\(.number). Install with `implementation(\"io.usetrace:trace-sdk-android:\($v)\")`."' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/notes.md"
          echo "Releasing $version from #$number." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: The Maven Central and signing secrets are set
        if: steps.plan.outputs.go == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "All four are set."
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::Not set on this repository:$missing. The dry run does not use them; a release would stop here."
          else
            echo "::error::Not set on this repository:$missing. Nothing was tagged or published. Set them (Settings, Secrets and variables, Actions) and re-run this run."
            exit 1
          fi

      - name: A licence is declared
        if: steps.plan.outputs.go == 'true'
        run: |
          if ls LICENSE* > /dev/null 2>&1 && grep -q '^POM_LICENSE_NAME=' gradle.properties; then
            echo "Licence: $(sed -n 's/^POM_LICENSE_NAME=//p' gradle.properties)."
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::No LICENSE file with POM_LICENSE_NAME, POM_LICENSE_URL and POM_LICENSE_DIST in gradle.properties. Maven Central refuses a POM without a licence, so a release would stop here."
          else
            echo "::error::No LICENSE file with POM_LICENSE_NAME, POM_LICENSE_URL and POM_LICENSE_DIST in gradle.properties. Maven Central refuses a POM without a licence. Nothing was tagged or published."
            exit 1
          fi

      - uses: actions/setup-java@v6
        if: steps.plan.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.go == 'true'

      - name: A throwaway signing key, of the kind the real one is (ed25519)
        if: steps.plan.outputs.go == 'true' && env.DRY_RUN == 'true'
        run: |
          gpg --batch --pinentry-mode loopback --passphrase dry-run --quick-gen-key "Trace dry run <dry-run@usetrace.invalid>" ed25519 sign 1d
          {
            echo 'ORG_GRADLE_PROJECT_signingInMemoryKey<<KEY'
            gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys
            echo 'KEY'
            echo 'ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=dry-run'
          } >> "$GITHUB_ENV"

      - name: Publish to Maven Local (dry run)
        if: steps.plan.outputs.go == 'true' && env.DRY_RUN == 'true'
        run: ./gradlew :trace:publishToMavenLocal --no-daemon

      - name: Every file is there and signed (dry run)
        if: steps.plan.outputs.go == 'true' && env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          dir="$HOME/.m2/repository/io/usetrace/trace-sdk-android/$VERSION"
          ls -l "$dir"
          # The file the GitHub release attaches.
          test -s trace/build/outputs/aar/trace-sdk-android-release.aar || { echo "::error::No trace/build/outputs/aar/trace-sdk-android-release.aar."; exit 1; }
          for suffix in .aar -sources.jar -javadoc.jar .pom .module; do
            file="$dir/trace-sdk-android-$VERSION$suffix"
            test -s "$file" || { echo "::error::Missing $(basename "$file")."; exit 1; }
            gpg --verify "$file.asc" "$file"
          done
          unzip -l "$dir/trace-sdk-android-$VERSION.aar" | grep -q ' classes.jar$' || { echo "::error::The AAR has no classes.jar."; exit 1; }
          unzip -l "$dir/trace-sdk-android-$VERSION-sources.jar" | grep -q 'io/usetrace/sdk/Trace.kt$' || { echo "::error::The sources jar has no Trace.kt."; exit 1; }
          unzip -l "$dir/trace-sdk-android-$VERSION-javadoc.jar" | grep -q 'index.html$' || { echo "::error::The javadoc jar has no index.html."; exit 1; }
          pom="$dir/trace-sdk-android-$VERSION.pom"
          for element in '<groupId>io.usetrace</groupId>' '<artifactId>trace-sdk-android</artifactId>' "<version>$VERSION</version>" '<packaging>aar</packaging>' '<name>' '<description>' '<url>' '<developers>' '<scm>' 'com.android.installreferrer'; do
            grep -qF "$element" "$pom" || { echo "::error::The POM has no $element."; exit 1; }
          done
          grep -qF '<licenses>' "$pom" || echo "::warning::The POM has no licence yet; Maven Central will refuse it."
          cat "$pom"

      - name: Tag ${{ steps.plan.outputs.tag }}
        if: steps.plan.outputs.go == 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # Before uploading, so a failed upload is re-run from this commit and never from a newer one.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already at this commit (a re-run)."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi

      - name: Publish to Maven Central
        if: steps.plan.outputs.go == 'true' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :trace:publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache

      - name: GitHub release with the AAR
        if: steps.plan.outputs.go == 'true' && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          cp trace/build/outputs/aar/trace-sdk-android-release.aar "$RUNNER_TEMP/trace-sdk-android-$VERSION.aar"
          gh release create "$TAG" "$RUNNER_TEMP/trace-sdk-android-$VERSION.aar" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: A throwaway app resolves it
        if: steps.plan.outputs.go == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            scripts/resolve-check.sh "$VERSION" --local
          else
            scripts/resolve-check.sh "$VERSION"
          fi
