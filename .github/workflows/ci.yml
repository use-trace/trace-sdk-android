name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # House rules shared by every Trace repository (docs/plans/REPO_AUTOMATION.md in use-trace/trace).
  house:
    name: house
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes or en dashes
        run: |
          # Byte patterns, so the check reads the same whatever the runner's locale. -I skips binary files.
          if git grep -nIF -e $'\xe2\x80\x93' -e $'\xe2\x80\x94' -- .; then
            echo "Found an em dash or en dash. Use commas, colons or full stops." >&2
            exit 1
          fi
          echo "Clean."
      - name: Runners are pinned
        run: |
          # A moving label such as ubuntu-latest changes the machine under every job on GitHub's schedule, not ours.
          if grep -nE '^[[:space:]]*runs-on:.*-latest' .github/workflows/*.yml; then
            echo "Pin the runner (ubuntu-24.04 or macos-15)." >&2
            exit 1
          fi
          echo "Pinned."

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the library
        run: ./gradlew :trace:assembleRelease --no-daemon

  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the unit tests
        run: ./gradlew :trace:testDebugUnitTest --no-daemon
      - name: Keep the reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: trace/build/reports/tests/
