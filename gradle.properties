org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
# Android Gradle plugin 9 compiles Kotlin itself and refuses the Kotlin Android plugin, but the binary compatibility
# validator behind the api check only attaches to that plugin: without it there is no apiCheck task. These two keep
# the Kotlin Android plugin and the old DSL it needs, until the api check moves to the Kotlin plugin's own ABI
# validation. Plugin 10 removes both switches, and the weekly newest toolchain run will say so first.
android.builtInKotlin=false
android.newDsl=false

# The POM published to Maven Central (com.vanniktech.maven.publish reads these). Central refuses a POM without a
# licence; the licence lines match LICENSE.
POM_NAME=Trace Android SDK
POM_DESCRIPTION=Install attribution and conversions for Android apps, for Trace (usetrace.io).
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/use-trace/trace-sdk-android
POM_SCM_URL=https://github.com/use-trace/trace-sdk-android
POM_SCM_CONNECTION=scm:git:https://github.com/use-trace/trace-sdk-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/use-trace/trace-sdk-android.git
POM_DEVELOPER_ID=use-trace
POM_DEVELOPER_NAME=Trace
POM_DEVELOPER_URL=https://usetrace.io
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
